name: Atualizar agenda e publicar site
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['dist/**', '.github/**']
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix .github/scripts --ignore-scripts
      - run: node --test .github/scripts/sync-agenda.test.cjs
      - name: Ler agenda pública do Google
        run: node .github/scripts/sync-agenda.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
